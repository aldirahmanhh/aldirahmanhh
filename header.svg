<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Aldi Rahman header" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="1000" height="240" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="240" fill="url(#bg)"/>

    <!-- floating dots -->
    <circle cx="120" cy="60" r="3" fill="#36BCF7" fill-opacity="0.6">
      <animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="80" r="4" fill="#36BCF7" fill-opacity="0.5">
      <animate attributeName="cy" values="80;55;80" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="40" r="2.5" fill="#ffffff" fill-opacity="0.5">
      <animate attributeName="cy" values="40;60;40" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="95" r="2.5" fill="#ffffff" fill-opacity="0.4">
      <animate attributeName="cy" values="95;75;95" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- waves -->
    <path d="M0 195 Q125 165 250 195 T500 195 T750 195 T1000 195 T1250 195 T1500 195 T1750 195 T2000 195 V240 H0 Z" fill="#36BCF7" fill-opacity="0.25">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M-500 210 Q-375 180 -250 210 T0 210 T250 210 T500 210 T750 210 T1000 210 T1250 210 T1500 210 V240 H-500 Z" fill="#0e75b6" fill-opacity="0.45">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="500 0" dur="12s" repeatCount="indefinite"/>
    </path>

    <!-- text -->
    <text x="500" y="115" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" opacity="0">
      Aldi Rahman
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="500" y="156" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#9fd8f5" opacity="0">
      Full-Stack | Mobile | Data &amp; AI Enthusiast
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.6s" fill="freeze"/>
    </text>
  </g>
</svg>
